name: Update Country Rankings (JSON)

on:
  schedule:
    # Executa diariamente às 23:00 UTC (01:00 AM CAT - UTC+2)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      preset:
        description: 'Preset específico, "all" para todos os 16, ou vazio para o lote diário automático'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-rankings:
    name: Extract & Generate Country JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - name: Build CLI Engine
        run: go build -o commit-rank .

      - name: Generate Country JSON Datasets
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/countries

          INPUT_PRESET="${{ github.event.inputs.preset }}"
          if [ "$INPUT_PRESET" = "all" ]; then
            PRESETS="worldwide mozambique angola nigeria south-africa kenya united-states canada mexico the-bahamas panama brazil argentina colombia venezuela uruguay hong-kong macau taiwan kosovo kurdistan portugal germany france netherlands russia china india japan south-korea saudi-arabia australia new-zealand papua-new-guinea"
          elif [ -n "$INPUT_PRESET" ]; then
            PRESETS="$INPUT_PRESET"
          else
            # Rotacao diaria inteligente (ciclo de 8 dias) para equilibrar paises densos e lotes continentais
            DAY_MOD=$(( $(date -u +%j) % 8 ))
            case $DAY_MOD in
              0)
                echo "Batch 0 (Long Presets - North America): Worldwide + United States"
                PRESETS="worldwide united-states"
                ;;
              1)
                echo "Batch 1 (Long Presets - South America): Worldwide + Brazil"
                PRESETS="worldwide brazil"
                ;;
              2)
                echo "Batch 2 (Short Presets - Africa): Mozambique, Angola, Nigeria, South Africa, Kenya"
                PRESETS="mozambique angola nigeria south-africa kenya"
                ;;
              3)
                echo "Batch 3 (Short Presets - North America & Caribbean): Canada, Mexico, The Bahamas, Panama"
                PRESETS="canada mexico the-bahamas panama"
                ;;
              4)
                echo "Batch 4 (Short Presets - South America): Argentina, Colombia, Venezuela, Uruguay"
                PRESETS="argentina colombia venezuela uruguay"
                ;;
              5)
                echo "Batch 5 (Short Presets - Special Territories): Hong Kong, Macau, Taiwan, Kosovo, Kurdistan"
                PRESETS="hong-kong macau taiwan kosovo kurdistan"
                ;;
              6)
                echo "Batch 6 (Short Presets - Europe): Portugal, Germany, France, Netherlands, Russia"
                PRESETS="portugal germany france netherlands russia"
                ;;
              7)
                echo "Batch 7 (Short Presets - Asia & Oceania): China, India, Japan, South Korea, Saudi Arabia, Australia, New Zealand, Papua New Guinea"
                PRESETS="china india japan south-korea saudi-arabia australia new-zealand papua-new-guinea"
                ;;
            esac
          fi

          # Quantidade de Devs e Orgs finais no JSON, e profundidade de amostragem por seguidores
          AMOUNT=100
          ORGS=100
          CONSIDER=1000

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for preset in $PRESETS; do
            echo "Extracting ranking for: $preset (amount=$AMOUNT, orgs=$ORGS, consider=$CONSIDER)"
            if ./commit-rank --preset "$preset" --amount "$AMOUNT" --consider "$CONSIDER" --orgs "$ORGS" --output json --file "data/countries/${preset}.json"; then
              git add "data/countries/${preset}.json"
              if ! git diff --staged --quiet; then
                git commit -m "chore(data): update dataset for $preset [skip ci]"
                # Puxa atualizações concorrentes com rebase e envia incrementalmente
                git pull --rebase origin main || true
                git push origin main || echo "Incremental push failed for $preset, continuing..."
              fi
            else
              echo "Skipped $preset due to extraction errors"
            fi
          done

      - name: Final Datasets Consistency Check
        run: |
          git add data/countries/*.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): auto-update country ranking datasets [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "All datasets are already synchronized."
          fi
